      --muted: #94a3b8;
      --border: #1e3a5f;

    * { box-sizing: border-box; }
    body {

    .logo {

      color: var(--accent);

    h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--accent); }

    .req { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
    .btn {

      padding: 14px 32px;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .steps {
      text-align: left;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.7;
    }
    .steps strong { color: var(--text); display: block; margin-bottom: 8px; }
    .changelog { margin-top: 20px; font-size: 0.85rem; color: var(--muted); text-align: left; }

</head>
